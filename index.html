<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agora</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F1B2A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
/* Identité Agora (design/DESIGN.md) : bleu nuit, vert d'action, Newsreader pour les titres, Inter pour le texte. */
:root{--nuit:#0F1B2A;--vert:#0A6E4F;--vert-f:#07533B;--vert-c:#E7F3EE;--mint:#9FE3C6;--ph:#1C2B3D;
--bg:#F2F4F7;--card:#FFFFFF;--text:#111827;--muted:#4B5563;--line:#D1D5DB;--line2:#E5E7EB;--chip:#EEF1F5;
--av-bg:#FDF0CC;--av-fg:#6B4A00;--accent:#0A6E4F;--warn:#6B4A00;--warnbg:#FDF0CC;--okfg:#07533B;--okbg:#E7F3EE;--badfg:#991B1B;--badbg:#FEE2E2;
--shadow:0 1px 2px rgba(15,27,42,.06),0 1px 1px rgba(15,27,42,.04);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--nuit:#0A1422;--vert:#0F7D5A;--vert-f:#9FE3C6;--vert-c:#12352A;--ph:#1C2B3D;
--bg:#0B1220;--card:#131C2E;--text:#E6EBF5;--muted:#A3AEC2;--line:#2A3850;--line2:#22304A;--chip:#1B2A47;
--av-bg:#3A2E0A;--av-fg:#FBD38D;--accent:#6FD3A8;--warn:#FBD38D;--warnbg:#3A2E0A;--okfg:#9FE3C6;--okbg:#12352A;--badfg:#FCA5A5;--badbg:#3B1414;
--shadow:none;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom);-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--accent)}
.serif{font-family:Newsreader,Georgia,"Times New Roman",serif}
svg.i{width:18px;height:18px;flex:none;vertical-align:-3px}
/* En-tête et onglets */
header.top{position:sticky;top:0;z-index:5;background:var(--nuit);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.brand{flex:1;display:flex;align-items:baseline;gap:8px;min-width:0;background:none;border:0;padding:0;color:#fff;text-align:left}
.brand b{font-family:Newsreader,Georgia,serif;font-size:26px;font-weight:700;letter-spacing:-.5px}
.brand span{font-size:11px;color:#C9D3DF}
.ibtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;position:relative}
.ibtn .dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:999px;background:var(--mint);color:var(--nuit);font-size:10px;font-weight:700;line-height:16px;padding:0 4px}
nav.tabs{background:var(--card);border-bottom:1px solid var(--line2);display:flex;gap:6px;padding:10px 16px;overflow-x:auto}
nav.tabs a{flex:none;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;color:var(--text);text-decoration:none;font-weight:600;font-size:14px}
nav.tabs a.on{background:var(--nuit);color:#fff}
@media (prefers-color-scheme:dark){nav.tabs a.on{background:#24364F}}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
main.wide{max-width:760px}
footer.note{max-width:560px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12px}
/* Éléments communs */
.label{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;line-height:1.5}
.pill.nuit{background:var(--nuit);color:#fff}.pill.blanc{background:#fff;color:var(--nuit)}
.pill.av{background:var(--av-bg);color:var(--av-fg)}.pill.ok{background:var(--okbg);color:var(--okfg)}
.pill svg.i{width:14px;height:14px}
.cover{background:var(--ph);color:#E6EBF5;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.cover .nom{font-family:Newsreader,Georgia,serif;font-weight:700;letter-spacing:-.5px;text-align:center;padding:0 12px;line-height:1.1;opacity:.92}
.cover .tl{position:absolute;top:12px;left:12px}.cover .br{position:absolute;bottom:12px;right:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:var(--vert);color:#fff;border:0;border-radius:12px;padding:10px 16px;font-weight:600;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.07)}
.btn.sec{background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.dark{background:var(--nuit);color:#fff}
.btn.white{background:#fff;color:var(--nuit)}
.btn.full{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.lnk{background:none;border:0;padding:6px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
#state{text-align:center;color:var(--muted);padding:30px 10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;background:var(--nuit);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:90vw}
/* Accueil */
.today{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:4px 2px 14px}
.today h1{margin:0;font-family:Newsreader,Georgia,serif;font-size:32px;line-height:1.1}
.today span{color:var(--muted);font-size:14px}
.une{display:block;background:var(--card);border:1px solid var(--line2);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:var(--shadow);margin-bottom:8px}
.une .cover{height:190px}.une .cover .nom{font-size:44px}
.une .body{padding:14px 16px 16px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.une h2{margin:6px 0 0;font-family:Newsreader,Georgia,serif;font-size:24px;line-height:1.2}
.row-item{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:10px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.row-item .cover{width:96px;height:96px;border-radius:12px;flex:none}.row-item .cover .nom{font-size:17px}
.row-item .m{font-size:12px;font-weight:700;color:var(--accent)}
.row-item .t{font-weight:600;font-size:16px;line-height:1.3;margin:2px 0}
.row-item .s{font-size:13px;color:var(--muted)}
/* Journal découpé en fiches */
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;margin:-6px 0 6px}
.hero{background:var(--nuit);color:#fff;border-radius:18px;overflow:hidden;margin-bottom:14px}
.hero .cover{height:150px}.hero .cover .nom{font-size:40px}
.hero .body{padding:14px 16px 16px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:#C9D3DF}
.hero .ey{color:var(--mint);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 4px}
.hero h1{margin:0;font-family:Newsreader,Georgia,serif;font-size:23px;line-height:1.25;font-weight:700}
.hero h1.long{font-size:19px;line-height:1.35;font-weight:600}
.hero .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;font-size:13px;color:#C9D3DF}
.fiche{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.fiche .num,.qlist .num{display:inline-flex;flex:none;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:var(--vert-c);color:var(--vert-f);font-size:13px;font-weight:700}
.fhead{display:flex;align-items:center;gap:10px}
.theme{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.listen{display:inline-flex;align-items:center;gap:8px;min-height:40px;margin-top:12px;padding:6px 14px;border-radius:999px;border:1px solid var(--line2);background:var(--chip);color:var(--text);font-size:14px;font-weight:600;text-decoration:none}
.listen svg.i{width:14px;height:14px}
.listen.dark{background:var(--nuit);color:#fff;border-color:var(--nuit);margin-top:8px}
.listen.big{display:flex;width:100%;justify-content:center;min-height:48px;margin:0;background:var(--nuit);color:#fff;border-color:var(--nuit);border-radius:12px;font-size:15px}
.player{margin-top:10px}.player audio{width:100%}.player small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.ents{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.ent{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;font-weight:600;text-decoration:none}
.ent svg.i{width:14px;height:14px;color:var(--accent)}.ent:hover{border-color:var(--accent)}
.regh h1{margin:4px 0 4px;font-family:Newsreader,Georgia,serif;font-size:30px;line-height:1.15}.regh .fn{margin:0 0 10px;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}.stats b{color:var(--text);font-size:15px}
.tl-day{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.tl-it{background:var(--card);border:1px solid var(--line2);border-left:3px solid var(--vert);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.tl-it>a,.tl-it>div{display:block;color:inherit;text-decoration:none}.tl-it .m{font-size:12px;color:var(--muted)}.tl-it .t{font-weight:600;margin-top:2px}
.src-lnk{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--accent)}.src-lnk svg.i{width:13px;height:13px}
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin-bottom:12px}
.row-item.reg{align-items:flex-start}.regic{display:flex;width:44px;height:44px;flex:none;border-radius:12px;background:var(--vert-c);color:var(--vert-f);align-items:center;justify-content:center}
.rouge{display:flex;align-items:center;gap:10px;background:var(--badbg);color:var(--badfg);border:1px solid currentColor;border-radius:12px;padding:12px 14px;margin:0 0 12px;font-weight:600}
.rouge .btn{margin-left:auto;background:#B91C1C;min-height:40px}
.invites{display:flex;flex-wrap:wrap;gap:8px;margin:0 2px 14px}
.inv{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;background:var(--card)}
.fiche h2{margin:10px 0 6px;font-family:Newsreader,Georgia,serif;font-size:21px;line-height:1.25}
.fiche p{margin:0;color:var(--text);font-size:15.5px}
.acts-row{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line2)}
.act{display:inline-flex;align-items:center;gap:6px;min-height:40px;background:none;border:0;padding:0 2px;font-size:14px;font-weight:600;color:var(--text)}
.act.sub{color:var(--muted);font-weight:500}
.act:hover{color:var(--accent)}
.more-btn{width:100%;margin-bottom:12px}
.appr{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px;margin-bottom:12px}
.appr ul{margin:6px 0 0;padding-left:18px}.appr li{margin:6px 0}
.appr small{display:block;color:var(--muted);margin-top:8px}
.final{background:var(--nuit);color:#fff;border-radius:18px;padding:18px 16px;margin:16px 0}
.final .ey{color:var(--mint);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.final h2{margin:6px 0 14px;font-family:Newsreader,Georgia,serif;font-size:23px;line-height:1.25}
.final .btn{width:100%;margin-top:10px}
/* Fiche seule (lien partagé) */
.bandeau{display:flex;align-items:center;gap:8px;background:var(--vert-c);color:var(--vert-f);font-size:13px;padding:10px 14px;border-radius:12px;margin-bottom:12px}
.solo .badges{display:flex;flex-wrap:wrap;gap:6px}
.solo .ext{font-size:13px;color:var(--muted);margin:12px 0 6px}
.solo h1{margin:0 0 10px;font-family:Newsreader,Georgia,serif;font-size:30px;line-height:1.15}
.solo .txt{font-size:18px;line-height:1.6}
.solo hr{border:0;border-top:1px solid var(--line2);margin:16px 0}
.goto{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.goto .h{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.goto .logo{width:52px;height:52px;border-radius:12px;font-size:13px}
.goto b{display:block}.goto span{font-size:13px;color:var(--muted)}
.aussi{background:var(--nuit);color:#fff;border-radius:18px;padding:16px;margin:12px 0}
.aussi .ey{color:var(--mint);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.aussi a.it{display:block;background:rgba(255,255,255,.07);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:#fff;text-decoration:none;font-weight:600;font-size:15px}
.aussi small{display:block;color:#C9D3DF;margin:4px 2px 12px}
/* Émission */
.em-card{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:16px;margin:-34px 10px 14px;position:relative;box-shadow:0 4px 18px rgba(15,27,42,.08)}
.em-card h1{margin:4px 0 12px;font-family:Newsreader,Georgia,serif;font-size:27px;line-height:1.15}
.em-cover{height:190px;border-radius:18px 18px 0 0;margin:0 -16px}
.qlist{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:6px 16px;margin-bottom:12px}
.qlist h2{font-size:17px;margin:12px 0 4px;text-transform:none;letter-spacing:0;color:var(--text)}
.qlist .q{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.qlist .q:first-of-type{border-top:0}
.bref{font-family:Newsreader,Georgia,serif;font-size:20px;line-height:1.4;margin:0 2px 12px}
/* Verset */
.vcard{background:var(--nuit);color:#fff;border-radius:18px;padding:22px 22px 24px;margin-bottom:12px}
.vcard .top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#C9D3DF}
.vcard .ey{color:#F2C14E;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:12px}
.vcard blockquote{margin:40px 0 36px;font-family:Newsreader,Georgia,serif;font-size:30px;line-height:1.3}
.vcard blockquote.long{font-size:19px;line-height:1.55;margin:22px 0}
.vcard blockquote sup{font-family:Inter,sans-serif;font-size:11px;color:#C9D3DF;margin-right:3px}
.vcard .ref b{display:block;font-size:16px}.vcard .ref span{font-size:13px;color:#C9D3DF}
.vcard .res{margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.15);font-size:14px;color:#DCE3EC}
.encart{display:flex;gap:14px;align-items:flex-start;background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px;margin-bottom:12px}
.encart .ic{width:48px;height:48px;border-radius:12px;background:var(--av-bg);color:var(--av-fg);display:flex;align-items:center;justify-content:center;flex:none}
.encart b{display:block}.encart span{font-size:13px;color:var(--muted)}
.vprev{background:var(--card);border:1px solid var(--line2);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.vprev .d{font-size:13px;color:var(--muted)}
.vprev q{display:block;font-family:Newsreader,Georgia,serif;font-size:19px;line-height:1.4;margin:6px 0 10px;quotes:none}
.vprev .f{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px}
/* Connexion et menu */
.login{max-width:360px;margin:40px auto;text-align:left}
.login h1{font-family:Newsreader,Georgia,serif;font-size:30px;margin:0 0 6px}
.login input[type=password]{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;margin:14px 0 10px}
.menu a,.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:0 6px;background:none;border:0;border-bottom:1px solid var(--line2);color:var(--text);text-decoration:none;font-weight:600;text-align:left}
.menu a:last-child,.menu button:last-child{border-bottom:0}
/* Sources : seuls les champs propres à ce formulaire complètent les styles de l'admin. */
.source-select{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.source-checks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.source-checks label{display:flex;align-items:center;gap:6px;min-height:44px;padding:6px 10px;border:1px solid var(--line2);border-radius:12px;background:var(--chip);font-size:14px}
.source-checks input{width:18px;height:18px;accent-color:var(--vert)}
.source-confirm{display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px;margin:6px 0}
.source-confirm input{width:18px;height:18px;accent-color:var(--vert);flex:none}
.source-exemples{padding-left:20px;margin:8px 0}.source-exemples li{margin:10px 0}.source-exemples a{display:inline-block;min-height:44px;padding:6px 0}.source-exemples small,.source-preview>small{display:block;font-size:12px}
.source-preview{background:var(--vert-c);color:var(--vert-f);padding:10px 12px;border-radius:12px;margin:10px 0;font-size:14px}
.source-exemples{list-style:none;padding:0}.source-exemples .source-video{display:flex;gap:12px;align-items:flex-start;text-decoration:none;width:100%;min-height:44px}.source-miniature{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 128px;aspect-ratio:4/3;overflow:hidden;border-radius:8px;background:var(--bg);font-size:12px;text-align:center}.source-miniature img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.source-miniature.chargee>span{visibility:hidden}.source-video-texte{min-width:0;overflow-wrap:anywhere}.source-video-texte>span:first-child{text-decoration:underline}.source-video-action{display:block;margin-top:8px;font-weight:600}.source-video:focus-visible{outline:2px solid currentColor;outline-offset:3px;border-radius:8px}@media(max-width:480px){.source-exemples .source-video{flex-direction:column}.source-miniature{flex-basis:auto;width:100%;max-width:320px}}
/* Admin : mêmes couleurs et formes (classes historiques conservées) */
#adm h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 2px 8px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.src{font-weight:600;color:var(--accent)}
.tag{background:var(--chip);border-radius:6px;padding:1px 7px}.tag.warn{background:var(--warnbg);color:var(--warn)}
.msg{white-space:normal;word-wrap:break-word;overflow-wrap:anywhere}
.chip{flex:none;background:var(--chip);color:var(--text);border:1px solid var(--line2);border-radius:999px;padding:6px 13px;font-size:14px;min-height:36px}
.chip.on{background:var(--nuit);color:#fff;border-color:var(--nuit)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.row input[type=password]{flex:1;min-width:180px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.err{color:var(--badfg);font-size:14px;min-height:1.2em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0 12px}
.kpi{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:10px 12px}
.kpi b{display:block;font-size:22px;font-family:Newsreader,Georgia,serif}.kpi span{font-size:12px;color:var(--muted)}
button.kpi{font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:44px;position:relative;transition:border-color .15s,background .15s}
button.kpi:hover{border-color:var(--vert)}
button.kpi:focus-visible{outline:2px solid var(--vert);outline-offset:2px}

/* ---------- Lecture d'un résumé : média, émission, fiches ---------- */
function mediaOf(s){
  const u=String(s.url||'').toLowerCase(),src=String(s.source||'').toLowerCase();
  if(s.media_nom)return {nom:s.media_nom,de:s.media_nom,sur:s.media_nom,domaine:u.includes('youtu')?'YouTube':((u.match(/^https?:\/\/(?:www\.)?([^/]+)/)||[])[1]||s.media_nom)};
  if(u.includes('crtv')||src.includes('crtv'))return {nom:'CRTV',de:'la CRTV',sur:'la CRTV',domaine:'crtv.cm'};
  if(s.source_id==='equinoxe'||src.includes('quinoxe'))return {nom:'Équinoxe TV',de:'Équinoxe TV',sur:'Équinoxe TV',domaine:'YouTube'};
  if(u.includes('rfi.fr')||src.includes('rfi'))return {nom:'RFI',de:'RFI',sur:'RFI',domaine:'rfi.fr'};
  const n=String(s.source||'Source').split(/[,:]/)[0].trim();
  return {nom:n,de:n,sur:n,domaine:(u.match(/^https?:\/\/(?:www\.)?([^/]+)/)||[])[1]||n};
}
function emissionName(s){
  if(mediaOf(s).nom==='Équinoxe TV')return 'Journal 20h';
  // Les résumés reconstitués portent un titre générique (« Bulletin d'information CRTV. ») : on prend le nom de la source.
  const base=/^bulletin d.information/i.test(s.title||'')||!s.title?s.source:s.title;
  return String(base||'').replace(/\s+(sur|on)\s+(la\s+)?CRTV\s*$/i,'').replace(/\s*\(CRTV\)\s*$/i,'').trim();
}
const typeOf=s=>s.kind==='verset'?'verset':s.kind==='texte'?'article':/journal|news/i.test(emissionName(s))?'journal':'emission';
const clean=t=>String(t||'').replace(/[*_~]/g,'').replace(/[ \t]+/g,' ').trim();
// Titre écrit tout en majuscules par l'IA : remis en minuscules pour la lecture, en gardant
// les sigles (CEMAC, CAN) et l'orthographe des noms propres telle qu'elle apparaît dans le texte.
const PETITS=new Set('a à au aux de des du en et la le les l d un une pour par sur dans avec sans vers ou où son sa ses leur qui que'.split(' '));
function formesDe(ctx){
  // Mots écrits avec une majuscule en milieu de phrase (noms propres probables)
  const formes={};
  (ctx||'').replace(/[A-Za-zÀ-ÿ'’-]+/g,(w,i,all)=>{
    const avant=all.slice(Math.max(0,i-3),i);  // un mot en début de phrase n'est pas forcément un nom propre
    if(/[a-zà-ÿ]/.test(w)&&/^[A-ZÀ-Ý]/.test(w)&&i>0&&!/[.!?:\n*🔹]\s*$/.test(avant))formes[w.toLowerCase()]=w;return w});
  return formes;
}
// Dans une liste de titres (« Sacre en vue, démonétisation… »), minuscule après la virgule sauf nom propre.
const enListe=(t,formes)=>{const w=(t.match(/^[A-Za-zÀ-ÿ'’-]+/)||[''])[0];return formes[w.toLowerCase()]||(w.length>1&&w===w.toUpperCase())?t:t.charAt(0).toLowerCase()+t.slice(1)};
function lisible(t,ctx){
  const lettres=t.replace(/[^A-Za-zÀ-ÿ]/g,'');
  if(lettres.length<6||lettres.replace(/[^a-zà-ÿ]/g,'').length>lettres.length*.2)return t;
  const formes=formesDe(ctx);
  let out=t.replace(/[A-Za-zÀ-ÿ'’-]+/g,w=>{const l=w.toLowerCase();if(formes[l])return formes[l];if(w.length<=5&&!PETITS.has(l)&&w===w.toUpperCase())return w;return l});
  return out.charAt(0).toUpperCase()+out.slice(1);
}
const PC={};
function parse(s){
  if(PC[s.id])return PC[s.id];
  let sec='intro',ess=[],fiches=[],qs=[],intro=[],url=s.url||null;
  for(const raw of String(s.message||'').split('\n')){
    const l=raw.trim();if(!l)continue;
    if(/^📺/.test(l)&&!ess.length&&!intro.length&&!fiches.length)continue;
    if(/^📎/.test(l)){const m=l.match(/https?:\/\/\S+/);if(m&&!url)url=m[0];continue}
    const h=clean(l).toUpperCase();
    if(l.startsWith('*')&&/^L.ESSENTIEL/.test(h)){sec='ess';continue}
    if(l.startsWith('*')&&/^LES FAITS MARQUANTS/.test(h)){sec='faits';continue}
    if(/^POUR APPROFONDIR/.test(h)){sec='q';continue}
    if(sec==='q'){if(/^[-•]/.test(l))qs.push(clean(l.replace(/^[-•]\s*/,'')));continue}
    if(/^🔹/.test(l)||(sec==='faits'&&/^[-•]/.test(l))){
      const t=l.replace(/^(🔹|[-•])\s*/,''),m=t.match(/^\*([^*]+?)\*\s*:?\s*(.*)$/);
      fiches.push(m?{titre:clean(m[1]).replace(/\s*:$/,''),texte:clean(m[2])}:{titre:'',texte:clean(t)});
      sec='faits';continue;
    }
    if(sec==='ess')ess.push(clean(l));
    else if(sec==='faits'&&fiches.length)fiches[fiches.length-1].texte+=' '+clean(l);
    else intro.push(clean(l));
  }
  const ctx=String(s.message||'');
  fiches.forEach(f=>{f.titre=lisible(f.titre,ctx)});
  // Annexe du pipeline (phase B) : thème et instant de chaque fiche, seulement si elle est alignée.
  const st=s.structure||{};
  if(Array.isArray(st.fiches)&&st.fiches.length===Math.max(1,fiches.length))fiches.forEach((f,i)=>{f.theme=st.fiches[i].theme||'';f.debut=st.fiches[i].debut||''});
  const qd=Array.isArray(st.questions)&&st.questions.length===qs.length?st.questions.map(q=>q.debut||''):[];
  const article=!fiches.length;
  if(article){fiches=[{titre:clean(s.title)||mediaOf(s).nom,texte:[...ess,...intro].join('\n\n'),theme:((st.fiches||[])[0]||{}).theme||''}];ess=[]}
  else if(!ess.length&&intro.length)ess=intro;
  const words=fiches.reduce((n,f)=>n+(f.titre+' '+f.texte).split(/\s+/).length,0)+ess.join(' ').split(/\s+/).length;
  return PC[s.id]={fiches,essentiel:ess.join(' '),questions:qs,qdebuts:qd,url,article,presentateur:st.presentateur||'',invites:Array.isArray(st.invites)?st.invites:[],minutes:Math.max(1,Math.round(words/220)),
    titreUne:article?fiches[0].titre:(fiches.slice(0,3).map(f=>f.titre).filter(Boolean).map((t,i)=>i?enListe(t,formesDe(ctx)):t).join(', ')||ess.join(' ').slice(0,90))};
}
const kindLabel=s=>{const t=typeOf(s);return s.kind==='texte'?'Résumé d\'un article':(t==='emission'?'Résumé d\'une émission ':'Résumé d\'un journal ')+(s.kind==='video'?'vidéo':'audio')};
const kindIcon=s=>s.kind==='video'?'video':s.kind==='texte'?'doc':'mic';
const verb=s=>s.kind==='video'?'Regarder':s.kind==='texte'?'Lire':'Écouter';
const cover=(s,size)=>'<div class="cover'+(size?' '+size:'')+'"><span class="nom">'+esc(mediaOf(s).nom)+'</span></div>';
const metaInfos=(s,p)=>(p.article?'Article':(typeOf(s)==='emission'?'Émission ':'Journal ')+(s.kind==='video'?'vidéo':'audio')+' · '+p.fiches.length+' infos')+' · '+p.minutes+' min';

/* ---------- « Écouter ce passage » ----------
   Mode par média (modifiable le jour où un média donne son accord) :
   - lecteur : petit lecteur dans la fiche, qui lit le fichier du média depuis SON serveur, au bon instant
               (CRTV : sa page n'a pas de barre de progression ; usage limité à la phase privée, accord
               de la CRTV nécessaire avant l'ouverture au public, voir A_FAIRE.md)
   - youtube : la vidéo s'ouvre sur YouTube au bon instant (chaîne du média)
   - page    : la page du média, avec « passage vers mm:ss » */
const PASSAGE={'CRTV':'lecteur','Équinoxe TV':'youtube'};
const AVANT=5;  // la lecture démarre quelques secondes avant l'instant indiqué
const sec=t=>{const p=String(t||'').split(':').map(Number);return p.length===3?p[0]*3600+p[1]*60+p[2]:p[0]*60+(p[1]||0)};
function ecouter(s,debut,libre,cls){
  if(!debut)return '';
  const M=mediaOf(s),mode=PASSAGE[M.nom]||(/youtu/.test(s.url||'')?'youtube':'page'),t=Math.max(0,sec(debut)-AVANT),lab=esc(libre||verb(s)+' ce passage')+' · vers '+esc(debut);
  if(mode==='youtube'&&/youtu/.test(s.url||''))return '<a class="listen'+(cls?' '+cls:'')+'" href="'+esc(s.url+(s.url.includes('?')?'&':'?')+'t='+t+'s')+'" target="_blank" rel="noopener">'+I('play')+lab+'</a>';
  if(mode==='lecteur'&&s.media_url)return '<button class="listen'+(cls?' '+cls:'')+'" data-play="'+esc(s.id)+'|'+t+'">'+I('play')+lab+'</button>';
  return s.url?'<a class="listen'+(cls?' '+cls:'')+'" href="'+esc(s.url)+'" target="_blank" rel="noopener">'+I('ext')+lab+' sur '+esc(M.domaine)+'</a>':'';
}
function jouer(btn){
  const [id,t]=btn.dataset.play.split('|'),s=data.find(x=>x.id===id);if(!s)return;
  document.querySelectorAll('.player audio').forEach(a=>a.pause());
  let box=btn.nextElementSibling;
  if(!box||!box.classList.contains('player')){
    const M=mediaOf(s);box=document.createElement('div');box.className='player';
    box.innerHTML='<audio controls preload="none"></audio><small>Son diffusé par '+esc(M.de)+', depuis son serveur.'+(s.url?' <a href="'+esc(s.url)+'" target="_blank" rel="noopener">Écouter sur '+esc(M.domaine)+'</a>':'')+'</small>';
    btn.after(box);
  }
  const a=box.querySelector('audio');
  a.src=s.media_url+'#t='+t;
  a.addEventListener('loadedmetadata',()=>{if(Math.abs(a.currentTime-t)>2)a.currentTime=+t},{once:true});
  a.play().catch(()=>{});
}

/* ---------- Partage : mention ajoutée au partage et à la copie (pas à la lecture) ---------- */
const BASE=()=>location.origin+location.pathname;
const linkFiche=(s,n)=>BASE()+'#/f/'+encodeURIComponent(s.id)+'/'+n;
const linkJournal=s=>BASE()+'#/'+(typeOf(s)==='emission'?'e':'j')+'/'+encodeURIComponent(s.id);
function mention(s,url){
  const M=mediaOf(s),p=parse(s),d=dfr(s.published_at,{day:'2-digit',month:'2-digit',year:'numeric'});
  return 'D\'après '+M.de+', '+(p.article?'« '+p.fiches[0].titre+' »':emissionName(s))+' du '+d+'\nLu sur Agora, l\'actualité en bref'+(url?'\n'+url:'');
}
let toastT=null;
function toast(t){let el=$('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600)}
async function shareText(title,text){
  try{if(navigator.share){await navigator.share({title,text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('Texte copié avec sa source : collez-le dans WhatsApp.')}
  catch(e){prompt('Copiez ce texte :',text)}
}
function shareFiche(s,n){const f=parse(s).fiches[n-1];shareText(f.titre,(f.titre?f.titre+'\n\n':'')+f.texte+'\n\n'+mention(s,linkFiche(s,n)))}
function shareJournal(s){
  const p=parse(s);
  shareText(emissionName(s),(p.essentiel?p.essentiel+'\n\n':'')+(p.article?p.fiches[0].texte+'\n\n':p.fiches.map((f,i)=>(i+1)+'. '+(f.titre||f.texte.slice(0,80))).join('\n')+'\n\n')+mention(s,linkJournal(s)));
}
// Copie d'un passage d'une fiche : la source est ajoutée automatiquement.
document.addEventListener('copy',e=>{
  const sel=getSelection(),txt=sel?sel.toString():'';
  if(!txt||!sel.anchorNode)return;
  const host=(sel.anchorNode.nodeType===1?sel.anchorNode:sel.anchorNode.parentElement).closest('[data-sid]');
  if(!host)return;
  const s=data.find(x=>x.id===host.dataset.sid);if(!s)return;
  e.clipboardData.setData('text/plain',txt+'\n\n'+(s.kind==='verset'?'Lu sur Agora, l\'actualité en bref':mention(s,host.dataset.n?linkFiche(s,+host.dataset.n):linkJournal(s))));
  e.preventDefault();
});

/* ---------- Navigation (adresses #/…) ---------- */
let VPW=null,firstRoute=location.hash,inAdmin=false;
const go=h=>{if(location.hash===h)render();else location.hash=h};
const route=()=>{const h=location.hash||'#/';const m=h.match(/^#\/(j|f|e|p|r|l)\/([^/]+)(?:\/(\d+))?/);return m?{v:m[1],id:decodeURIComponent(m[2]),n:+m[3]||1}:{v:h==='#admin'?'admin':h.replace(/^#\/?/,'')||'une'}};
const news=()=>data.filter(s=>s.kind!=='verset');
function tabs(cur){
  $('tabs').innerHTML=[['une','#/','À la une'],['rubriques','#/rubriques','Rubriques'],['emissions','#/emissions','Émissions'],['verset','#/verset','Verset']].map(([k,h,l])=>'<a href="'+h+'"'+(cur===k?' class="on" aria-current="page"':'')+'>'+l+'</a>').join('');
}
let LOCKED=false;  // écran de mot de passe affiché : aucune navigation ne doit le remplacer
function render(){
  const r=route();
  if(r.v==='admin'){showAdmin(true);return}  // l'admin a son propre mot de passe
  if(inAdmin)showAdmin(false);
  if(LOCKED){$('tabs').hidden=true;return}
  const cur={j:'une',f:'une',e:'emissions',mes:'une',p:'',recherche:'',r:'rubriques',l:'rubriques',interets:'une','pour-vous':'une'}[r.v]??r.v;
  tabs(cur);$('tabs').hidden=false;
  if(LF.cle!==location.hash)LF={cle:location.hash,sous:'',lieu:'',rub:'',lim:20};
  const V={une:vUne,emissions:vEmissions,verset:vVerset,mes:vMes,j:vJournal,f:vFiche,e:vEmission,p:vPage,recherche:vRecherche,
    rubriques:vRubriques,r:vRubrique,l:vLieu,interets:vInterets,'pour-vous':vPourVous}[r.v]||vUne;
  $('app').innerHTML=V(r);
  bindApp();
  mesBtn();
}
function bindApp(){
  document.querySelectorAll('[data-share-f]').forEach(b=>b.onclick=()=>{const [id,n]=b.dataset.shareF.split('|');const s=data.find(x=>x.id===id);if(s)shareFiche(s,+n)});
  document.querySelectorAll('[data-share-j]').forEach(b=>b.onclick=()=>{const s=data.find(x=>x.id===b.dataset.shareJ);if(s)shareJournal(s)});
  document.querySelectorAll('[data-share-v]').forEach(b=>b.onclick=()=>{const s=data.find(x=>x.id===b.dataset.shareV);if(s)shareVerset(s)});
  document.querySelectorAll('[data-sig]').forEach(b=>b.onclick=()=>{const [id,n]=b.dataset.sig.split('|');const s=data.find(x=>x.id===id);if(!s)return;const f=parse(s).fiches[n-1];sigOpen(s,(f.titre?f.titre+'\n':'')+f.texte)});
  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>jouer(b));
  document.querySelectorAll('[data-retrait]').forEach(b=>b.onclick=()=>{const x=b.dataset.retrait.split('|');retraitOpen(x[0]==='page'?x[2]:'',x[0]==='page'?{page:x[1]}:{sid:x[1],n:+x[2]})});
  const q=$('qreg');if(q){q.oninput=()=>{QREG=q.value;$('resreg').innerHTML=resultatsRecherche(QREG)};if(!QREG)q.focus()}
  const more=$('more');if(more)more.onclick=()=>{document.querySelectorAll('.fiche[hidden]').forEach(x=>x.hidden=false);more.remove()};
  const mb=$('mes_back');if(mb)mb.onclick=()=>history.length>1?history.back():go('#/');
  bindRubriques();
}

/* ---------- Écrans ---------- */
function vUne(){
  const L=news();
  if(!L.length)return '<div id="state">Aucun résumé pour le moment.</div>';
  const s0=L[0],p0=parse(s0),now=new Date();
  let h='<div class="today"><h1>'+esc(dayLabel(new Date(s0.published_at)))+'</h1><span>'+esc(now.toLocaleDateString('fr-FR',{timeZone:LTZ,weekday:'long',day:'numeric',month:'long'}))+'</span></div>'
   +blocPourVous()+(prefsActives()?'<div class="label">À la une</div>':'')
   +'<a class="une" href="'+esc(linkJournal(s0).replace(BASE(),''))+'"><div class="cover"><span class="tl pill blanc">'+esc(mediaOf(s0).nom)+'</span><span class="nom">'+esc(mediaOf(s0).nom)+'</span><span class="br pill nuit">'+(p0.article?'Article':p0.fiches.length+' infos')+' · '+p0.minutes+' min</span></div>'
   +'<div class="body"><div class="eyebrow">'+esc(emissionName(s0))+' · '+esc(quand(s0.published_at))+'</div><h2>'+esc(p0.titreUne)+'</h2></div></a>';
  let last=dayLabel(new Date(s0.published_at)),first=true;
  L.slice(1).forEach(s=>{
    const lab=dayLabel(new Date(s.published_at));
    if(first||lab!==last){h+='<div class="label">'+(lab===last?'Les autres résumés':esc(lab))+'</div>';last=lab;first=false}
    h+=rowItem(s);
  });
  return h;
}
function rowItem(s){
  const p=parse(s);
  return '<a class="row-item" href="'+esc(linkJournal(s).replace(BASE(),''))+'">'+cover(s)+'<div><div class="m">'+esc(mediaOf(s).nom)+'</div><div class="t">'+esc(p.article?p.fiches[0].titre:emissionName(s)+' : '+(p.titreUne||''))+'</div><div class="s">'+esc(metaInfos(s,p))+'</div></div></a>';
}
function badges(s){
  const M=mediaOf(s);
  return '<span class="pill nuit">D\'après '+esc(M.de)+'</span><span class="pill av">'+I(kindIcon(s))+esc(kindLabel(s))+'</span>'+(s.verifie?'<span class="pill ok">'+I('shield')+'Vérifié par recoupement</span>':'');

function rectFor(s,f){
  const R=(s.rectifications||[]).filter(r=>!f||clean((f.titre||'')+' '+f.texte).includes(clean(r.apres)));

/* ================= RUBRIQUES ET LIEUX (design/RUBRIQUES.md) =================
   Référentiels publics : rubriques.json (liste fermée, norme IPTC) et geo/ (GeoNames, chargés
   à la demande). Classement de chaque fiche calculé par le pipeline (s.classement : principale,
   secondaires, lieux et leurs noms). Choix du lecteur gardés sur ce téléphone, sans compte. */
const EDITION='CM';
const CONT={'@AF':'Afrique','@EU':'Europe','@NA':'Amérique du Nord','@SA':'Amérique du Sud','@AS':'Asie','@OC':'Océanie','@MONDE':'Monde'};
let RUB=null,RIDX={},GEO=null,GIDX=null,GPAYS={},LF={cle:''};
async function loadRefs(){
  try{if(!RUB){const r=await fetch('rubriques.json',{cache:'no-cache'});if(r.ok){RUB=await r.json();RIDX={};
    RUB.rubriques.forEach(x=>{RIDX[x.id]={nom:x.nom,top:x.id,icone:x.icone};x.sous.forEach(s=>RIDX[s.id]={nom:s.nom,top:x.id})})}}}catch(e){RUB=null}
  try{if(!GEO){const r=await fetch('geo/pays.json',{cache:'no-cache'});if(r.ok)GEO=(await r.json()).pays}}catch(e){GEO=null}
}
const topOf=id=>(RIDX[id]||{}).top||id;
const rnom=id=>(RIDX[id]||{}).nom||id;
const parentRub=t=>((RUB||{}).rattachements||{})[t];         // Football est compris dans Sport
const nrmL=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
// Classement aligné sur les fiches lues dans le texte (sinon rien : jamais de classement décalé).
function cls(s){const p=parse(s),c=Array.isArray(s.classement)?s.classement:[];return c.length===p.fiches.length?c:[]}
const rubLien=c=>'<a class="rlink" href="#/r/'+esc(c.r)+'">'+esc(rnom(topOf(c.r)))+(topOf(c.r)!==c.r?' · '+esc(rnom(c.r)):'')+'</a>';
const contDe=cc=>((GEO||{})[cc]||{}).continent;
function lnom(id,c){
  if(CONT[id])return CONT[id];
  if(id.length===2)return ((GEO||{})[id]||{}).nom||id;
  if(c&&c.n&&c.n[id])return c.n[id];
  const p=prefs(),l=((p&&p.lieux)||[]).find(x=>x.id===id);if(l)return l.nom;
  for(const cc in GEO||{}){const r=(GEO[cc].regions||[]).find(x=>x[0]===id);if(r)return r[1]}
  return 'Lieu';
}
const lienLieu=(id,cc)=>'#/l/'+encodeURIComponent(id.length===2||id[0]==='@'||!cc?id:cc+':'+id);
// Lieux affichés sur une fiche : le lieu le plus précis, et les autres pays concernés.
function lieuxAffiches(c){
  const L=(c&&c.l)||[],pays=L.filter(x=>x.length===2),precis=L.filter(x=>x.length!==2);
  const out=[];
  if(precis.length){const d=precis[precis.length-1];out.push([d,pays[0]])}
  pays.forEach(cc=>{if(!(precis.length&&cc===EDITION))out.push([cc,cc])});
  return out;
}
function classeLigne(c){
  if(!c||c.a_classer||!RUB)return '';
  const L=lieuxAffiches(c),S=(c.s||[]).filter(x=>RIDX[x]);

// Toutes les fiches classées des N derniers jours, la plus récente d'abord : {s, n, f, c}.
function fichesClassees(jours){
  const lim=Date.now()-(jours||30)*864e5,out=[];
  news().forEach(s=>{if(new Date(s.published_at)<lim)return;const p=parse(s),C=cls(s);
    p.fiches.forEach((f,i)=>{const c=C[i];if(c&&c.r)out.push({s,n:i+1,f,c})})});
  return out;
}

function dansRub(c,id){
  const ids=[c.r,...(c.s||[])];
  if(topOf(id)===id)return ids.some(x=>topOf(x)===id||parentRub(topOf(x))===id);
  return ids.includes(id);
}
function dansLieu(c,id){

  if(id==='@MONDE')return L.some(x=>x.length===2&&contDe(x)!==contDe(EDITION));

}

  const ordre={P:0,R:1,D:2,V:3};
  pool.forEach(x=>{if(vus.has(x[0]))return;const n=nrmL(x[1]);if(n.startsWith(q)||n.includes(' '+q)||n.includes('-'+q)){vus.add(x[0]);R.push(x)}});
  R.sort((a,b)=>(nrmL(a[1]).startsWith(q)?0:1)-(nrmL(b[1]).startsWith(q)?0:1)||ordre[a[2]]-ordre[b[2]]);
  const TYP={P:'Pays',R:'Région',D:'Département',V:'Ville ou village'};
  let h=R.slice(0,12).map(x=>{const [id,nom,t,cc,par]=x,on=CH.lieux.some(l=>l.id===id),det=t==='P'?'':(par&&par!==nom?par+', ':'')+lnom(cc);
    return '<div class="opt"><span class="t">'+esc(nom)+'<small>'+esc(TYP[t]+(det?' · '+det:''))+'</small></span>'
      +(t==='P'&&!GPAYS[cc]?'<button class="prec" data-chpays="'+esc(cc)+'">Ses lieux</button>':'')
      +coche(on,'data-chl="'+esc(id)+'|'+esc(nom)+'|'+esc(t==='P'?'':det)+'|'+esc(cc)+'"',nom)+'</div>'}).join('');
  if(!R.length)h='<p class="hint" style="margin:10px 0">Aucun lieu trouvé pour « '+esc(QL)+' ». Pour un petit village hors du Cameroun, cherchez d\'abord son pays puis touchez « Ses lieux ».</p>';
  return h;
}

/* ================= SIGNALEMENT D'ERREUR (équipe) =================
   3 gestes : type d'erreur, passage concerné, correction proposée.
   Le signalement devient une « issue » GitHub du dépôt du pipeline, vérifiée
   automatiquement par le workflow signalement.yml. */
let TEAM=null,SG=null;
async function loadTeam(){
  // Jeton limité aux issues, chiffré avec le mot de passe lecteur (absent = bouton masqué).
  try{const r=await fetch('team.enc.json?t='+Date.now(),{cache:'no-store'});TEAM=r.ok?await decrypt(await r.json(),VPW):null}catch(e){TEAM=null}
}
const dlong=iso=>{const d=new Date(iso);return d.toLocaleDateString('fr-FR',{timeZone:LTZ,day:'numeric',month:'long',year:'numeric'})+' à '+hhmm(d).replace(':','h')};
function rectBox(R){
  const last=R[R.length-1];
  return '<details class="rect"><summary>'+I('check')+'Rectifié le '+esc(dlong(last.date))+'</summary>'+R.map(r=>'<div>« '+esc(r.avant)+' » devient « '+esc(r.apres)+' ». '+(r.methode==='auto'?'Correction suggérée par un lecteur, vérifiée automatiquement.':'Correction suggérée par un lecteur, validée par l\'équipe.')+'</div>').join('')+'</details>';
}
const SGT=[['nom','user2','Un nom','Personne, lieu ou institution mal orthographié'],['fait','pin','Un fait','Chiffre, fonction ou événement inexact'],['date','cal','Une date','Jour, heure ou moment erroné'],['autre','pen','Autre chose','Formulation trompeuse, oubli…']];
const plain=t=>String(t||'').replace(/https?:\/\/\S+/g,'').replace(/[*_~]/g,'').replace(/[ \t]+/g,' ');
const sentences=l=>(l.match(/[^.!?…]+[.!?…]*["»)]*\s*/g)||[]).map(s=>s.trim()).filter(s=>s.length>1);
function sigOpen(e,txt){SG={e,txt:txt||'',step:1,type:'',passage:'',prop:'',url:'',who:localStorage.getItem('agora_nom')||'',err:'',busy:false};document.body.style.overflow='hidden';sigDraw()}
function sigClose(){SG=null;const s=$('sheet');if(s)s.remove();document.body.style.overflow=''}
function sigDraw(){
  let s=$('sheet');
  if(!s){s=document.createElement('div');s.id='sheet';s.className='sheet';s.setAttribute('role','dialog');s.setAttribute('aria-modal','true');s.onclick=ev=>{if(ev.target===s)sigClose()};document.body.appendChild(s)}
  const T=SGT.find(t=>t[0]===SG.type),labels=['Quel type d\'erreur ?','Quel passage ?','Quelle correction ?'];
  let h='<div><div class="shead"><h3>'+(SG.step>3?'Merci !':'Signaler une erreur')+'</h3><button class="x" id="sg_x" aria-label="Fermer">×</button></div>';
  if(SG.step<=3)h+='<div class="steps">'+[1,2,3].map(i=>'<i class="'+(i<=SG.step?'on':'')+'"></i>').join('')+'</div><div class="stepl">Étape '+SG.step+' sur 3 · '+labels[SG.step-1]+' · '+esc(SG.e.source)+'</div>';
  if(SG.step===1){
    h+='<div class="types">'+SGT.map(t=>'<button class="type" data-t="'+t[0]+'"><span class="ic">'+I(t[1])+'</span><b>'+t[2]+'</b><span>'+t[3]+'</span></button>').join('')+'</div>';
  }else if(SG.step===2){
    const lines=plain(SG.txt||SG.e.message).split('\n').map(l=>l.trim()).filter(Boolean);
    let i=0;
    h+='<p class="hint">Touchez la phrase concernée, ou sélectionnez seulement quelques mots avec le doigt.</p><div class="pick" id="sg_pick">'+lines.map(l=>sentences(l).map(x=>'<span data-i="'+(i++)+'">'+esc(x)+'</span>').join(' ')).join('<br>')+'</div>'
      +'<div class="quote'+(SG.passage?'':' empty')+'" id="sg_q">'+(SG.passage?'« '+esc(SG.passage)+' »':'Aucun passage choisi pour le moment.')+'</div>'
      +'<div class="acts"><button class="btn sec" id="sg_back">Retour</button><button class="btn" id="sg_next"'+(SG.passage?'':' disabled')+'>Continuer</button></div>';
  }else if(SG.step===3){
    h+='<div class="quote">« '+esc(SG.passage)+' »</div>'
      +'<label class="field"><span>'+(SG.type==='nom'?'Orthographe exacte':'Ce qu\'il faudrait écrire à la place')+'</span><textarea id="sg_prop" maxlength="600">'+esc(SG.prop||SG.passage)+'</textarea><small>Modifiez seulement ce qui est faux : ce texte remplacera le passage ci-dessus.</small></label>'
      +'<label class="field"><span>Source (facultatif)</span><input id="sg_url" type="url" inputmode="url" placeholder="https://… article ou page officielle" value="'+esc(SG.url)+'"><small>Un lien qui prouve la correction accélère la vérification.</small></label>'
      +'<label class="field"><span>Votre prénom (facultatif)</span><input id="sg_who" maxlength="60" value="'+esc(SG.who)+'"></label>'
      +'<div class="err">'+esc(SG.err)+'</div>'
      +'<div class="acts"><button class="btn sec" id="sg_back">Retour</button><button class="btn" id="sg_send"'+(SG.busy?' disabled':'')+'>'+(SG.busy?'Envoi…':'Envoyer le signalement')+'</button></div>';
  }else{
    h+='<div class="done"><div class="big">'+I('check')+'</div><p><b>Signalement n° '+esc(SG.num)+' enregistré</b></p><p>Merci de contribuer à la fiabilité d\'Agora.</p><p class="hint">Votre signalement est d\'abord vérifié automatiquement, puis par l\'équipe si nécessaire. Si l\'erreur est confirmée, la fiche sera rectifiée avec la mention « Rectifié le… ».</p><p class="hint">Suivez son traitement dans « Mes signalements ».</p><div class="row"><button class="btn sec" id="sg_mes">Mes signalements</button><button class="btn" id="sg_ok">Fermer</button></div></div>';
  }
  s.innerHTML=h+'</div>';
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f};
  on('sg_x',sigClose);on('sg_ok',sigClose);on('sg_mes',()=>{sigClose();go('#/mes')});
  on('sg_back',()=>{if(SG.step===3)sigKeep();SG.step--;SG.err='';sigDraw()});
  on('sg_next',()=>{if(SG.passage){SG.step=3;sigDraw()}});
  on('sg_send',sigSend);
  s.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{SG.type=b.dataset.t;SG.step=2;sigDraw()});
  s.querySelectorAll('#sg_pick span').forEach(sp=>{

function sigPick(t){
  t=t.replace(/\s+/g,' ').trim();
  if(t.length>500){t=t.slice(0,500)}
  SG.passage=t;
  const q=$('sg_q');if(q){q.className='quote'+(t?'':' empty');q.textContent=t?'« '+t+' »':'Aucun passage choisi pour le moment.'}

}
document.addEventListener('selectionchange',()=>{
  if(!SG||SG.step!==2)return;
  const sel=getSelection(),p=$('sg_pick');
  if(!sel||sel.isCollapsed||!p||!p.contains(sel.anchorNode))return;
  p.querySelectorAll('span.on').forEach(x=>x.classList.remove('on'));
  sigPick(sel.toString());
});
document.addEventListener('keydown',e=>{if(SG&&e.key==='Escape')sigClose()});
function sigKeep(){SG.prop=($('sg_prop')||{}).value||SG.prop;SG.url=(($('sg_url')||{}).value||'').trim();SG.who=(($('sg_who')||{}).value||'').trim()}
async function sigSend(){
  sigKeep();
  const prop=SG.prop.replace(/\s+/g,' ').trim();
  if(!prop||prop===SG.passage){SG.err='Écrivez la correction : le texte est identique au passage.';sigDraw();return}
  if(SG.url&&!/^https?:\/\/\S+$/i.test(SG.url)){SG.err='Le lien doit commencer par https://';sigDraw();return}
  if(SG.who)localStorage.setItem('agora_nom',SG.who);
  SG.busy=true;SG.err='';sigDraw();
  const e=SG.e,T=SGT.find(t=>t[0]===SG.type);
  const p={v:1,summary_id:e.id,report_id:e.report_id||null,source:e.source,published_at:e.published_at,type:SG.type,passage:SG.passage,proposition:prop,source_url:SG.url||null,auteur:SG.who||null};
  // Bloc caché lu par le workflow ; « < » et « > » échappés pour ne jamais fermer le commentaire.
  const json=JSON.stringify(p).replace(/</g,'\\u003c').replace(/>/g,'\\u003e');
  const body='Signalement envoyé depuis le site Agora.\n\n**Type :** '+T[2]+'\n**Fiche :** '+e.source+' ('+dt(e.published_at)+')\n**Passage publié :** « '+SG.passage+' »\n**Correction proposée :** « '+prop+' »'+(SG.url?'\n**Source :** '+SG.url:'')+(SG.who?'\n**Signalé par :** '+SG.who:'')+'\n\nLa vérification automatique démarre dans quelques instants.\n\n<!-- agora-signalement\n'+json+'\n-->';
  try{
    const r=await fetch('https://api.github.com/repos/'+TEAM.repo+'/issues',{method:'POST',headers:{Authorization:'Bearer '+TEAM.token,Accept:'application/vnd.github+json'},body:JSON.stringify({title:'[Signalement] '+T[2]+' : '+SG.passage.slice(0,70),body})});
    if(!r.ok)throw new Error(r.status===401||r.status===403?'accès refusé (jeton expiré ?)':'erreur '+r.status);
    SG.num=(await r.json()).number;SG.step=4;SG.busy=false;
    mesAdd({num:SG.num,date:new Date().toISOString(),source:e.source,type:SG.type,passage:SG.passage,proposition:prop});mesBtn();
    sigDraw();
  }catch(err){SG.busy=false;SG.err='Envoi impossible : '+err.message+'. Réessayez plus tard.';sigDraw()}
}
/* ================= MES SIGNALEMENTS =================

async function decrypt(blob,pass){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(blob.salt),iterations:blob.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  let buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.iv)},key,b64(blob.data));
  if(blob.gz){buf=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}
  return JSON.parse(new TextDecoder().decode(buf));
}

    const d=dest||t,on=d===t&&(kf[t]||'')===k;

async function sgDecide(issue,decision,extra){

  h+='<p style="font-size:14px">La rédaction classe chaque fiche dans la liste fermée (13 rubriques, 65 sous-rubriques) et note ses lieux ; un contrôle sans IA ne garde que ce qui est sûr. Les fiches publiées avant les rubriques sont classées la nuit ('+(clsEtat().restant||0)+' restante'+((clsEtat().restant||0)>1?'s':'')+'). Règles : design/RUBRIQUES.md.</p>';
  if(clsMsg)h+='<div class="alert">'+esc(clsMsg)+'</div>';
  if(!ghCfg().token)h+='<div class="alert">Pour corriger, configurez d\'abord l\'accès GitHub (en bas de l\'onglet Annuaire).</div>';
  const F={a_classer:acl,sans,admin:adm}[kf.c]||[...acl,...L.filter(x=>!(x.c&&x.c.a_classer))];
  h+=kbar('c',{a_classer:'À classer',sans:'Pas encore classées',admin:'Corrigées par l\'admin'}[kf.c]||'',F.length,'fiche');
  return h+(F.slice(0,60).map(clsCard).join('')||'<div class="mono">Aucune fiche dans cette catégorie.</div>')+(F.length>60?'<div class="mono">… et '+(F.length-60)+' autres (les 60 plus récentes sont affichées).</div>':'');
}
function clsCard(x){
  const {s,i,f,c,cle}=x,o=c&&c.o;
  let h='<article class="card"><div class="meta"><span class="src">'+esc(s.source)+'</span><span>'+dt(s.published_at)+'</span><span>fiche '+(i+1)+'</span>'
    +(c&&c.a_classer?'<span class="b warn">À classer</span>':!c?'<span class="b">Pas encore classée</span>':'<span class="b'+(o==='admin'?' ok':'')+'">'+esc(ORIG[o]||o)+'</span>')+'</div>'
    +'<div style="font-weight:600">'+esc(f.titre||clean(f.texte).slice(0,90))+'</div><div class="mono" style="margin-top:4px">'+esc(clsTexte(c))+'</div>'
    +(c&&c.avant&&c.avant.r!==undefined?'<div class="mono">Avant la correction : '+esc(c.avant.r?clsTexte({r:c.avant.r,s:c.avant.s||[],l:c.avant.l||[]}):'à classer')+'</div>':'');
  if(clsOpen===cle)h+=clsForm(x);
  else h+='<div class="row" style="margin-top:8px"><button class="btn sec" data-clopen="'+esc(cle)+'">'+(c&&c.r?'Corriger':'Classer')+'</button>'+(o==='admin'?'<button class="btn sec" data-clundo="'+esc(cle)+'">Annuler la correction</button>':'')+'</div>';
  return h+'</article>';
}
function clsOptions(sel,vide){
  return (vide?'<option value="">'+vide+'</option>':'')+RUB.rubriques.map(r=>'<optgroup label="'+esc(r.nom)+'"><option value="'+esc(r.id)+'"'+(sel===r.id?' selected':'')+'>'+esc(r.nom)+' (toute la rubrique)</option>'
    +r.sous.map(x=>'<option value="'+esc(x.id)+'"'+(sel===x.id?' selected':'')+'>'+esc(x.nom)+'</option>').join('')+'</optgroup>').join('');
}
function clsForm(x){
  const c=x.c||{},L=c.l||[],pays=L.find(i=>i.length===2)||EDITION,reg=(L.find(i=>((GEO||{})[pays]||{regions:[]}).regions.some(r=>r[0]===i))||'');
  const precis=L.filter(i=>i.length!==2&&i!==reg),s=c.s||[];
  const sel=(id,inner)=>'<select id="'+id+'" style="width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;padding:0 10px">'+inner+'</select>';
  return '<div style="margin-top:10px"><label class="field"><span>Rubrique principale</span>'+sel('cl_p',clsOptions(c.r||'','Choisir…'))+'</label>'
    +'<label class="field"><span>Rubriques secondaires (2 au plus)</span>'+sel('cl_s1',clsOptions(s[0]||'','Aucune'))+'<div style="height:6px"></div>'+sel('cl_s2',clsOptions(s[1]||'','Aucune'))+'</label>'
    +'<label class="field"><span>Pays principal</span>'+sel('cl_pays',Object.entries(GEO||{}).sort((a,b)=>a[1].nom.localeCompare(b[1].nom,'fr')).map(([cc,v])=>'<option value="'+cc+'"'+(cc===pays?' selected':'')+'>'+esc(v.nom)+'</option>').join(''))+'</label>'
    +'<label class="field"><span>Région (si connue)</span>'+sel('cl_reg',clsRegions(pays,reg))+'</label>'
    +(precis.length?'<label style="display:flex;gap:8px;align-items:center;min-height:44px"><input type="checkbox" id="cl_keep" checked> Garder le lieu précis : '+esc(precis.map(i=>lnom(i,c)).join(', '))+'</label>':'')
    +'<div class="row"><button class="btn" data-clsave="'+esc(x.cle)+'">Enregistrer</button><button class="btn sec" data-clopen="">Annuler</button></div></div>';
}
const clsRegions=(cc,reg)=>'<option value="">Non précisée</option>'+(((GEO||{})[cc]||{}).regions||[]).map(([g,n])=>'<option value="'+g+'"'+(g===reg?' selected':'')+'>'+esc(n)+'</option>').join('');
async function clsSave(change,label){
  const c=ghCfg();if(!c.token||!c.repo){clsMsg='Configurez d\'abord l\'accès GitHub (en bas de l\'onglet Annuaire).';adminRender();return}
  clsMsg='Enregistrement…';adminRender();
  const H={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},url='https://api.github.com/repos/'+c.repo+'/contents/'+CLF;
  try{
    for(let essai=0;essai<2;essai++){
      let sha,d={};
      const g=await fetch(url+'?t='+Date.now(),{headers:H,cache:'no-store'});
      if(g.ok){const j=await g.json();sha=j.sha;d=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),x=>x.charCodeAt(0))))}
      else if(g.status!==404)throw new Error('lecture GitHub '+g.status);
      d.note=d.note||'Corrections du classement (rubriques et lieux) décidées par l\'administration (design/RUBRIQUES.md). Écrit depuis l\'onglet Classement de l\'admin.';
      d.fiches=d.fiches||{};
      change(d);
      const body=JSON.stringify(d,null,1)+'\n';
      const r=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify({message:'Classement : '+label,content:btoa(String.fromCharCode(...new TextEncoder().encode(body))),sha})});
      if(r.ok){A.state.classement=A.state.classement||{};A.state.classement.manuel=d;clsOpen='';clsMsg='Enregistré : '+label+'. Visible sur le site après la republication automatique (quelques minutes).';adminRender();return}
      if(r.status!==409)throw new Error('écriture GitHub '+r.status);
    }
    throw new Error('conflit répété');
  }catch(e){clsMsg='Échec : '+e.message+'. Vérifiez le jeton GitHub.';adminRender()}
}
function clsBind(){
  document.querySelectorAll('[data-clopen]').forEach(b=>b.onclick=()=>{clsOpen=b.dataset.clopen;clsMsg='';adminRender()});
  const pays=$('cl_pays');if(pays)pays.onchange=()=>{$('cl_reg').innerHTML=clsRegions(pays.value,'');const k=$('cl_keep');if(k)k.checked=false};
  document.querySelectorAll('[data-clsave]').forEach(b=>b.onclick=()=>{
    const cle=b.dataset.clsave,x=clsFiches().find(y=>y.cle===cle),c=(x&&x.c)||{},p=$('cl_p').value;
    if(!p){clsMsg='Choisissez la rubrique principale.';adminRender();return}
    const sec=[$('cl_s1').value,$('cl_s2').value].filter((v,i,a)=>v&&v!==p&&a.indexOf(v)===i&&topOf(v)!==topOf(p));
    const cc=$('cl_pays').value,reg=$('cl_reg').value,keep=$('cl_keep')&&$('cl_keep').checked;
    const ancienReg=(c.l||[]).find(i=>((GEO||{})[cc]||{regions:[]}).regions.some(r=>r[0]===i));
    const lieux=[cc,...(c.l||[]).filter(i=>i.length===2&&i!==cc),...(reg?[reg]:[]),...(keep?(c.l||[]).filter(i=>i.length!==2&&i!==ancienReg):[])];
    clsSave(d=>{d.fiches[cle]={rubrique:p,secondaires:sec,lieux,date:new Date().toISOString(),avant:{r:c.r||null,s:c.s||[],l:c.l||[]}}},'fiche '+cle+' : '+rnom(p));
  });
  document.querySelectorAll('[data-clundo]').forEach(b=>b.onclick=()=>{const cle=b.dataset.clundo;if(confirm('Annuler la correction de cette fiche ? Le classement d\'origine reviendra.'))clsSave(d=>{delete d.fiches[cle]},'correction annulée '+cle)});
}
function tabS(){
  return A.summaries.map(s=>{const k=KIND[s.kind]||KIND.texte;return '<article class="card"><div class="meta"><span class="src">'+esc(s.source)+'</span><span>'+dt(s.published_at)+'</span><span class="tag'+(k[1]?' warn':'')+'">'+k[0]+'</span></div><div class="msg">'+msg(s.message)+'</div><div class="mono" style="margin-top:8px">id '+esc(s.id)+' · rapport '+esc(s.report_id||'-')+'<br>'+link(s.url)+'</div></article>'}).join('')||'<div id="state">Aucun résumé.</div>';
}
if(location.hash==='#admin')showAdmin(true);
</script>
