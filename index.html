<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accès privé</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b1f3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#16202e;--muted:#667085;--line:#e3e7ee;--accent:#1d4ed8;--chip:#e8eefc;--warn:#b45309;--warnbg:#fef3c7}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--text:#e6ebf5;--muted:#93a0b8;--line:#22304a;--accent:#7aa2ff;--chip:#1b2a47;--warn:#fbbf24;--warnbg:#3a2e0a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:#0b1f3a;color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header h1{margin:0;font-size:20px;flex:1}
header small{opacity:.7;font-weight:400;font-size:12px;margin-left:6px}
button{font:inherit;cursor:pointer}
#refresh{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px}
main{max-width:720px;margin:0 auto;padding:12px 14px 40px}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.chip{flex:none;background:var(--chip);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:8px}
.src{font-weight:600;color:var(--accent)}
.tag{background:var(--chip);border-radius:6px;padding:1px 7px}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.msg{white-space:normal;word-wrap:break-word;overflow-wrap:anywhere}
.msg.clamp{max-height:11em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 70%,transparent);mask-image:linear-gradient(#000 70%,transparent)}
.more{background:none;border:0;color:var(--accent);padding:6px 0 0;font-weight:600}
a{color:var(--accent)}
#state{text-align:center;color:var(--muted);padding:30px 10px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 20px 30px}

header .hb{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:4px 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 12px}
.row input[type=password]{flex:1;min-width:180px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 14px;font-weight:600}
.btn.sec{background:var(--chip);color:var(--text);border:1px solid var(--line)}
.err{color:#dc2626;font-size:14px;min-height:1.2em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:8px 0 12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--muted)}
.alert{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.b{border-radius:6px;padding:1px 7px;font-size:12px;background:var(--chip)}
.b.ok{background:#dcfce7;color:#166534}.b.warn{background:var(--warnbg);color:var(--warn)}.b.bad{background:#fee2e2;color:#991b1b}
@media (prefers-color-scheme:dark){.b.ok{background:#12351f;color:#86efac}.b.bad{background:#3b1414;color:#fca5a5}}
details.rep>summary{cursor:pointer;color:var(--accent);font-weight:600;margin-top:6px}
details.rep h4{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;max-height:340px;overflow:auto;margin:4px 0}
.chg{border-left:3px solid var(--accent);padding:2px 0 2px 8px;margin:6px 0;font-size:14px}
.chg.no{border-color:#f59e0b}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
.mono{font:12px ui-monospace,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}
details.appr{margin:10px 0;padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
details.appr>summary{cursor:pointer;color:var(--accent);font-weight:600}
details.appr>div{margin-top:6px}
.runlog{max-height:520px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 0;margin:6px 0;font:12px/1.5 ui-monospace,Menlo,monospace}
.runlog div{padding:0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.runlog div.w{background:var(--warnbg);color:var(--warn)}
.runlog div.h{font-weight:700;color:var(--accent)}
/* Signalement d'erreur */
.foot{display:flex;justify-content:flex-end;margin-top:10px}
.sig{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:3px 12px;font-size:13px}
.sig:hover,.sig:focus-visible{color:var(--accent);border-color:var(--accent)}
details.rect{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
details.rect>summary{cursor:pointer;color:#15803d;font-weight:600}
@media (prefers-color-scheme:dark){details.rect>summary{color:#86efac}}
details.rect div{margin-top:4px}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,14,26,.55);animation:sfade .15s}
.sheet>div{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:sup .22s ease-out}
@media (min-width:640px){.sheet{align-items:center}.sheet>div{border-radius:20px}}
@keyframes sup{from{transform:translateY(40px);opacity:0}}@keyframes sfade{from{opacity:0}}
.shead{display:flex;align-items:center;gap:10px}.shead h3{flex:1;margin:0;font-size:18px}
.x{background:none;border:0;color:var(--muted);font-size:22px;line-height:1;padding:4px 8px}
.steps{display:flex;gap:6px;margin:10px 0 4px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--accent)}
.stepl{font-size:12px;color:var(--muted);margin-bottom:12px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.type{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px;color:var(--text);transition:border-color .1s,transform .1s}
.type:hover,.type:focus-visible{border-color:var(--accent)}.type:active{transform:scale(.98)}
.type .ic{display:block;font-size:22px;margin-bottom:4px}.type b{display:block}.type span{font-size:13px;color:var(--muted)}
.pick{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;max-height:40vh;overflow:auto;line-height:1.7}
.pick span{border-radius:4px;cursor:pointer;transition:background .1s}.pick span:hover{background:var(--chip)}.pick span.on{background:#fde68a;color:#111}
.hint{font-size:13px;color:var(--muted);margin:0 0 8px}
.quote{border-left:3px solid var(--accent);background:var(--chip);border-radius:0 10px 10px 0;padding:8px 10px;font-size:14px;margin:10px 0;overflow-wrap:anywhere}
.quote.empty{border-color:var(--line);color:var(--muted)}
.field{display:block;margin:12px 0}.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:4px}.field>small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.field textarea,.field input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
.field textarea{min-height:76px;resize:vertical}
.acts{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.btn:disabled{opacity:.45;cursor:default}
.done{text-align:center;padding:10px 4px}.done .big{font-size:42px}
.ev{font-size:14px;margin:4px 0}.ev b{font-weight:600}
.done p{margin:6px 0}.done .row{justify-content:center;margin-top:14px}
@media (max-width:480px){#mesBtn .lg{display:none}header small{display:none}}
</style>
</head>
<body>
<header><h1 id="brand">◆ Accès privé</h1><button id="mesBtn" class="hb" hidden aria-label="Mes signalements"></button><button id="adminBtn" class="hb" hidden>Admin</button><button id="refresh" aria-label="Actualiser">Actualiser</button></header>
<main>
<div id="pub"><div id="chips"></div><div id="list"></div><div id="state">Chargement…</div></div>
<div id="mes" hidden></div>
<div id="adm" hidden></div>
</main>
<footer>Résumés rédigés par IA à partir des sources citées. Pour les contenus audio ou vidéo, recoupez avec la source d'origine. Heures : Cameroun.</footer>
<script>
const TZ='Africa/Douala';
const KIND={texte:['Article',0],audio:['Audio · à recouper',1],video:['Vidéo · à recouper',1],podcast:['Podcast',0],verset:['Louis Segond 1910',0]};
let data=[],filter='all';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function fmt(t){
  let h=esc(t||'');
  h=h.replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">lien</a>');
  h=h.replace(/\*([^*\n]+)\*/g,'<strong>$1</strong>');
  h=h.replace(/(^|[\s(>])_([^_\n<]+)_(?=[\s.,;:!?)<]|$)/g,'$1<em>$2</em>');
  return h.replace(/\n/g,'<br>');
}
function msg(t){
  t=t||'';
  const m=t.search(/\*Pour approfondir\*/i);
  if(m<0)return fmt(t);
  const after=t.slice(m).replace(/^\*Pour approfondir\*\s*/i,'');
  const s=after.search(/\n\s*📎/);
  const sec=s<0?after:after.slice(0,s),post=s<0?'':after.slice(s);
  return fmt(t.slice(0,m).trimEnd())+'<details class="appr"><summary>Pour approfondir</summary><div>'+fmt(sec.trim())+'</div></details>'+(post?fmt(post.trim()):'');
}
const dayKey=d=>d.toLocaleDateString('fr-CA',{timeZone:TZ});
function dayLabel(d){
  const k=dayKey(d),now=new Date();
  if(k===dayKey(now))return "Aujourd'hui";
  if(k===dayKey(new Date(now-864e5)))return 'Hier';
  return d.toLocaleDateString('fr-FR',{timeZone:TZ,weekday:'long',day:'numeric',month:'long'});
}
const hhmm=d=>d.toLocaleTimeString('fr-FR',{timeZone:TZ,hour:'2-digit',minute:'2-digit'});
function chips(){
  const srcs=[...new Set(data.map(e=>e.source))];
  $('chips').innerHTML='';
  [['all','Tout'],...srcs.map(s=>[s,s])].forEach(([v,l])=>{
    const b=document.createElement('button');
    b.className='chip'+(filter===v?' on':'');b.textContent=l;
    b.onclick=()=>{filter=v;render()};
    $('chips').appendChild(b);
  });
}
function render(){
  chips();
  const items=data.filter(e=>filter==='all'||e.source===filter);
  const list=$('list');list.innerHTML='';
  $('state').textContent=items.length?'':'Aucun résumé pour le moment.';
  let last='';
  items.forEach(e=>{
    const d=new Date(e.published_at),lab=dayLabel(d);
    if(lab!==last){const h=document.createElement('h2');h.textContent=lab;list.appendChild(h);last=lab}
    const k=KIND[e.kind]||KIND.texte;
    const c=document.createElement('article');c.className='card';
    c.innerHTML='<div class="meta"><span class="src">'+esc(e.source)+'</span><span>'+hhmm(d)+'</span><span class="tag'+(k[1]?' warn':'')+'">'+k[0]+'</span></div><div class="msg">'+msg(e.message)+'</div>';
    const m=c.querySelector('.msg');
    if((e.message||'').length>650){
      m.classList.add('clamp');
      const b=document.createElement('button');b.className='more';b.textContent='Lire la suite';
      b.onclick=()=>{const o=m.classList.toggle('clamp');b.textContent=o?'Lire la suite':'Réduire'};
      c.appendChild(b);
    }
    if((e.rectifications||[]).length)c.insertAdjacentHTML('beforeend',rectBox(e.rectifications));
    // Pas de signalement sur le verset du jour : le texte biblique n'est jamais modifié.
    if(TEAM&&e.kind!=='verset'){
      const f=document.createElement('div');f.className='foot';
      const s=document.createElement('button');s.className='sig';s.textContent='⚑ Signaler une erreur';s.onclick=()=>sigOpen(e);
      f.appendChild(s);c.appendChild(f);
    }
    list.appendChild(c);
  });
}
let VPW=null;
function brand(on){
  $('brand').innerHTML=on?"◆ Agora<small>l'actualité en bref</small>":'◆ Accès privé';
  document.title=on?"Agora, l'actualité en bref":'Accès privé';
}
function viewerLock(msg){
  brand(false);$('chips').innerHTML='';$('list').innerHTML='';
  $('state').innerHTML='<div style="max-width:320px;margin:24px auto;text-align:left"><p>Accès réservé.</p><div class="row"><input id="vpw" type="password" placeholder="Mot de passe" autocomplete="current-password"><button class="btn" id="vgo">Entrer</button></div><label><input type="checkbox" id="vrem" checked> Se souvenir sur cet appareil</label><div class="err">'+esc(msg||'')+'</div></div>';
  $('vgo').onclick=()=>{VPW=$('vpw').value;if(!VPW)return;if($('vrem').checked)localStorage.setItem('agora_vpw',VPW);$('state').textContent='Déchiffrement…';load()};
  $('vpw').onkeydown=e=>{if(e.key==='Enter')$('vgo').click()};
}
async function load(){
  try{
    let r=await fetch('summaries.enc.json?t='+Date.now(),{cache:'no-store'});
    if(r.ok){
      if(!VPW)VPW=localStorage.getItem('agora_vpw');
      if(!VPW){viewerLock();return}
      try{data=await decrypt(await r.json(),VPW)}
      catch(e){VPW=null;localStorage.removeItem('agora_vpw');viewerLock('Mot de passe incorrect.');return}
      await loadTeam();
    }else{
      r=await fetch('summaries.json?t='+Date.now(),{cache:'no-store'});
      if(!r.ok)throw 0;
      data=await r.json();
    }
    if(!Array.isArray(data))data=[];
    brand(true);render();mesBtn();if(inMes)mesRender();
  }catch(e){
    $('state').textContent=data.length?'Hors ligne : affichage des derniers résumés connus.':'Impossible de charger les résumés. Vérifiez votre connexion.';
  }
}
/* ================= SIGNALEMENT D'ERREUR (équipe) =================
   3 gestes : type d'erreur, passage concerné, correction proposée.
   Le signalement devient une « issue » GitHub du dépôt du pipeline, vérifiée
   automatiquement par le workflow signalement.yml. */
let TEAM=null,SG=null;
async function loadTeam(){
  // Jeton limité aux issues, chiffré avec le mot de passe lecteur (absent = bouton masqué).
  try{const r=await fetch('team.enc.json?t='+Date.now(),{cache:'no-store'});TEAM=r.ok?await decrypt(await r.json(),VPW):null}catch(e){TEAM=null}
}
const dlong=iso=>{const d=new Date(iso);return d.toLocaleDateString('fr-FR',{timeZone:TZ,day:'numeric',month:'long',year:'numeric'})+' à '+hhmm(d).replace(':','h')};
function rectBox(R){
  const last=R[R.length-1];
  return '<details class="rect"><summary>✓ Rectifié le '+esc(dlong(last.date))+'</summary>'+R.map(r=>'<div>« '+esc(r.avant)+' » devient « '+esc(r.apres)+' ». '+(r.methode==='auto'?'Correction suggérée par un lecteur, vérifiée automatiquement.':'Correction suggérée par un lecteur, validée par l\'équipe.')+'</div>').join('')+'</details>';
}
const SGT=[['nom','👤','Un nom','Personne, lieu ou institution mal orthographié'],['fait','📌','Un fait','Chiffre, fonction ou événement inexact'],['date','📅','Une date','Jour, heure ou moment erroné'],['autre','✏️','Autre chose','Formulation trompeuse, oubli…']];
const plain=t=>String(t||'').replace(/https?:\/\/\S+/g,'').replace(/[*_~]/g,'').replace(/[ \t]+/g,' ');
const sentences=l=>(l.match(/[^.!?…]+[.!?…]*["»)]*\s*/g)||[]).map(s=>s.trim()).filter(s=>s.length>1);
function sigOpen(e){SG={e,step:1,type:'',passage:'',prop:'',url:'',who:localStorage.getItem('agora_nom')||'',err:'',busy:false};document.body.style.overflow='hidden';sigDraw()}
function sigClose(){SG=null;const s=$('sheet');if(s)s.remove();document.body.style.overflow=''}
function sigDraw(){
  let s=$('sheet');
  if(!s){s=document.createElement('div');s.id='sheet';s.className='sheet';s.setAttribute('role','dialog');s.setAttribute('aria-modal','true');s.onclick=ev=>{if(ev.target===s)sigClose()};document.body.appendChild(s)}
  const T=SGT.find(t=>t[0]===SG.type),labels=['Quel type d\'erreur ?','Quel passage ?','Quelle correction ?'];
  let h='<div><div class="shead"><h3>'+(SG.step>3?'Merci !':'Signaler une erreur')+'</h3><button class="x" id="sg_x" aria-label="Fermer">×</button></div>';
  if(SG.step<=3)h+='<div class="steps">'+[1,2,3].map(i=>'<i class="'+(i<=SG.step?'on':'')+'"></i>').join('')+'</div><div class="stepl">Étape '+SG.step+' sur 3 · '+labels[SG.step-1]+' · '+esc(SG.e.source)+'</div>';
  if(SG.step===1){
    h+='<div class="types">'+SGT.map(t=>'<button class="type" data-t="'+t[0]+'"><span class="ic">'+t[1]+'</span><b>'+t[2]+'</b><span>'+t[3]+'</span></button>').join('')+'</div>';
  }else if(SG.step===2){
    const lines=plain(SG.e.message).split('\n').map(l=>l.trim()).filter(Boolean);
    let i=0;
    h+='<p class="hint">Touchez la phrase concernée, ou sélectionnez seulement quelques mots avec le doigt.</p><div class="pick" id="sg_pick">'+lines.map(l=>sentences(l).map(x=>'<span data-i="'+(i++)+'">'+esc(x)+'</span>').join(' ')).join('<br>')+'</div>'
      +'<div class="quote'+(SG.passage?'':' empty')+'" id="sg_q">'+(SG.passage?'« '+esc(SG.passage)+' »':'Aucun passage choisi pour le moment.')+'</div>'
      +'<div class="acts"><button class="btn sec" id="sg_back">Retour</button><button class="btn" id="sg_next"'+(SG.passage?'':' disabled')+'>Continuer</button></div>';
  }else if(SG.step===3){
    h+='<div class="quote">« '+esc(SG.passage)+' »</div>'
      +'<label class="field"><span>'+(SG.type==='nom'?'Orthographe exacte':'Ce qu\'il faudrait écrire à la place')+'</span><textarea id="sg_prop" maxlength="600">'+esc(SG.prop||SG.passage)+'</textarea><small>Modifiez seulement ce qui est faux : ce texte remplacera le passage ci-dessus.</small></label>'
      +'<label class="field"><span>Source (facultatif)</span><input id="sg_url" type="url" inputmode="url" placeholder="https://… article ou page officielle" value="'+esc(SG.url)+'"><small>Un lien qui prouve la correction accélère la vérification.</small></label>'
      +'<label class="field"><span>Votre prénom (facultatif)</span><input id="sg_who" maxlength="60" value="'+esc(SG.who)+'"></label>'
      +'<div class="err">'+esc(SG.err)+'</div>'
      +'<div class="acts"><button class="btn sec" id="sg_back">Retour</button><button class="btn" id="sg_send"'+(SG.busy?' disabled':'')+'>'+(SG.busy?'Envoi…':'Envoyer le signalement')+'</button></div>';
  }else{
    h+='<div class="done"><div class="big">✓</div><p><b>Signalement n° '+esc(SG.num)+' enregistré</b></p><p>Merci de contribuer à la fiabilité d\'Agora.</p><p class="hint">Votre signalement est d\'abord vérifié automatiquement, puis par l\'équipe si nécessaire. Si l\'erreur est confirmée, la fiche sera rectifiée avec la mention « Rectifié le… ».</p><p class="hint">Suivez son traitement dans « Mes signalements ».</p><div class="row"><button class="btn sec" id="sg_mes">Mes signalements</button><button class="btn" id="sg_ok">Fermer</button></div></div>';
  }
  s.innerHTML=h+'</div>';
  const on=(id,f)=>{const el=$(id);if(el)el.onclick=f};
  on('sg_x',sigClose);on('sg_ok',sigClose);on('sg_mes',()=>{sigClose();showMes(true)});
  on('sg_back',()=>{if(SG.step===3)sigKeep();SG.step--;SG.err='';sigDraw()});
  on('sg_next',()=>{if(SG.passage){SG.step=3;sigDraw()}});
  on('sg_send',sigSend);
  s.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{SG.type=b.dataset.t;SG.step=2;sigDraw()});
  s.querySelectorAll('#sg_pick span').forEach(sp=>{
    if(sp.textContent===SG.passage)sp.classList.add('on');
    sp.onclick=()=>{const sel=getSelection();if(sel&&!sel.isCollapsed)return;s.querySelectorAll('#sg_pick span.on').forEach(x=>x.classList.remove('on'));sp.classList.add('on');sigPick(sp.textContent)};
  });
  const first=s.querySelector('.type,#sg_prop,#sg_ok');if(first)first.focus();
}
function sigPick(t){
  t=t.replace(/\s+/g,' ').trim();
  if(t.length>500){t=t.slice(0,500)}
  SG.passage=t;
  const q=$('sg_q');if(q){q.className='quote'+(t?'':' empty');q.textContent=t?'« '+t+' »':'Aucun passage choisi pour le moment.'}
  const n=$('sg_next');if(n)n.disabled=!t;
}
document.addEventListener('selectionchange',()=>{
  if(!SG||SG.step!==2)return;
  const sel=getSelection(),p=$('sg_pick');
  if(!sel||sel.isCollapsed||!p||!p.contains(sel.anchorNode))return;
  p.querySelectorAll('span.on').forEach(x=>x.classList.remove('on'));
  sigPick(sel.toString());
});
document.addEventListener('keydown',e=>{if(SG&&e.key==='Escape')sigClose()});
function sigKeep(){SG.prop=($('sg_prop')||{}).value||SG.prop;SG.url=(($('sg_url')||{}).value||'').trim();SG.who=(($('sg_who')||{}).value||'').trim()}
async function sigSend(){
  sigKeep();
  const prop=SG.prop.replace(/\s+/g,' ').trim();
  if(!prop||prop===SG.passage){SG.err='Écrivez la correction : le texte est identique au passage.';sigDraw();return}
  if(SG.url&&!/^https?:\/\/\S+$/i.test(SG.url)){SG.err='Le lien doit commencer par https://';sigDraw();return}
  if(SG.who)localStorage.setItem('agora_nom',SG.who);
  SG.busy=true;SG.err='';sigDraw();
  const e=SG.e,T=SGT.find(t=>t[0]===SG.type);
  const p={v:1,summary_id:e.id,report_id:e.report_id||null,source:e.source,published_at:e.published_at,type:SG.type,passage:SG.passage,proposition:prop,source_url:SG.url||null,auteur:SG.who||null};
  // Bloc caché lu par le workflow ; « < » et « > » échappés pour ne jamais fermer le commentaire.
  const json=JSON.stringify(p).replace(/</g,'\\u003c').replace(/>/g,'\\u003e');
  const body='Signalement envoyé depuis le site Agora.\n\n**Type :** '+T[2]+'\n**Fiche :** '+e.source+' ('+dt(e.published_at)+')\n**Passage publié :** « '+SG.passage+' »\n**Correction proposée :** « '+prop+' »'+(SG.url?'\n**Source :** '+SG.url:'')+(SG.who?'\n**Signalé par :** '+SG.who:'')+'\n\nLa vérification automatique démarre dans quelques instants.\n\n<!-- agora-signalement\n'+json+'\n-->';
  try{
    const r=await fetch('https://api.github.com/repos/'+TEAM.repo+'/issues',{method:'POST',headers:{Authorization:'Bearer '+TEAM.token,Accept:'application/vnd.github+json'},body:JSON.stringify({title:'[Signalement] '+T[2]+' : '+SG.passage.slice(0,70),body})});
    if(!r.ok)throw new Error(r.status===401||r.status===403?'accès refusé (jeton expiré ?)':'erreur '+r.status);
    SG.num=(await r.json()).number;SG.step=4;SG.busy=false;
    mesAdd({num:SG.num,date:new Date().toISOString(),source:e.source,type:SG.type,passage:SG.passage,proposition:prop});mesBtn();
    sigDraw();
  }catch(err){SG.busy=false;SG.err='Envoi impossible : '+err.message+'. Réessayez plus tard.';sigDraw()}
}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(blob,pass){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(blob.salt),iterations:blob.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  let buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(blob.iv)},key,b64(blob.data));
  if(blob.gz){buf=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer()}
  return JSON.parse(new TextDecoder().decode(buf));
}

const GHK='agora_gh';
const ghCfg=()=>{try{return JSON.parse(localStorage.getItem(GHK)||'{}')}catch(e){return {}}};

let annMsg='',annQ='';
async function ghFile(){
  const c=ghCfg(),url='https://api.github.com/repos/'+c.repo+'/contents/data/annuaire_noms.json';
  const r=await fetch(url+'?t='+Date.now(),{headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},cache:'no-store'});
  if(!r.ok)throw new Error('lecture GitHub '+r.status);
  const j=await r.json();
  const txt=new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g,'')),x=>x.charCodeAt(0)));
  return {url,sha:j.sha,data:JSON.parse(txt)};
}
async function annSave(change,label){
  const c=ghCfg();if(!c.token||!c.repo){annMsg='Configurez d\'abord l\'accès GitHub (en bas de cet onglet).';adminRender();return}
  annMsg='Enregistrement…';adminRender();
  try{
    for(let attempt=0;attempt<2;attempt++){
      const f=await ghFile();f.data.entrees=f.data.entrees||[];f.data.rejetes=f.data.rejetes||[];
      change(f.data);
      const body=JSON.stringify(f.data,null,1)+'\n',b64=btoa(String.fromCharCode(...new TextEncoder().encode(body)));
      const r=await fetch(f.url,{method:'PUT',headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},body:JSON.stringify({message:'Annuaire : '+label,content:b64,sha:f.sha})});
      if(r.ok){A.state.annuaire=A.state.annuaire||{};A.state.annuaire.manuel=f.data;annMsg='Enregistré : '+label+'. Pris en compte dès le prochain résumé.';adminRender();return}
      if(r.status!==409)throw new Error('écriture GitHub '+r.status);
    }
    throw new Error('conflit répété');
  }catch(e){annMsg='Échec : '+e.message+'. Vérifiez le jeton GitHub.';adminRender()}
}

   +'<h4>Faits d\'origine</h4><div class="mono">'+(v.faits?(v.faits.contiennent_correction?'contiennent la correction':'ne contiennent pas la correction')+' · '+(v.faits.contiennent_passage?'contiennent le passage publié':'ne contiennent pas le passage publié'):'-')+'</div>'
   +'<h4>Autres médias ('+(fl.medias_confirmants||[]).length+' confirment)</h4>'+((fl.sources||[]).map(x=>'<div>'+(x.confirme?'<span class="b ok">contient</span> ':'')+'['+esc(x.id)+'] '+link(x.url)+' : '+esc(x.titre)+'</div>').join('')||'<div class="mono">Aucun article trouvé</div>')
   +(s.source_url?'<h4>Source du lecteur</h4><div>'+link(s.source_url)+'</div><div class="mono">'+(u.ok?(u.contient?'la page contient la correction':'la page ne contient pas la correction')+(u.origine?' · média d\'origine, ne compte pas':''):'illisible : '+esc(u.erreur||'-'))+'</div>':'')
   +((v.notes||[]).length?'<h4>Notes</h4>'+pre(v.notes.join('\n')):'')
   +'<div class="mono" style="margin-top:6px">'+link(s.url)+'</div></details>';
  if(sgSent[s.issue])h+='<div class="alert">Décision envoyée ('+esc(sgSent[s.issue])+'), appliquée dans quelques minutes.</div>';
  else if(s.statut==='a_trancher')h+='<label class="field"><span>Texte retenu si vous acceptez</span><input id="sg_t'+s.issue+'" value="'+esc(s.proposition)+'"></label>'
   +(s.type==='nom'?'<label><input type="checkbox" id="sg_a'+s.issue+'"> Ajouter ce nom à l\'annuaire</label>':'')
   +'<label class="field"><span>Motif (facultatif, visible par la personne qui a signalé)</span><input id="sg_m'+s.issue+'"></label><div class="row"><button class="btn" data-acc="'+s.issue+'">Accepter</button><button class="btn sec" data-rej="'+s.issue+'">Rejeter</button></div>';
  else if(s.statut==='corrige_auto'||s.statut==='accepte')h+='<div class="row"><button class="btn sec" data-rej="'+s.issue+'" data-undo="1">Annuler la correction</button></div>';
  return h+'</article>';
}
async function sgDecide(issue,decision,extra){
  const c=ghCfg();if(!c.token||!c.repo){sgMsg='Configurez d\'abord l\'accès GitHub (en bas de l\'onglet Annuaire).';adminRender();return}
  sgMsg='Envoi de la décision…';adminRender();
  const H={Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json'},url='https://api.github.com/repos/'+c.repo+'/contents/data/decisions/'+issue+'.json';
  const body=JSON.stringify(Object.assign({issue,decision,date:new Date().toISOString()},extra),null,1)+'\n';
  try{
    let sha;const g=await fetch(url+'?t='+Date.now(),{headers:H,cache:'no-store'});if(g.ok)sha=(await g.json()).sha;
    const r=await fetch(url,{method:'PUT',headers:H,body:JSON.stringify({message:'Signalement n°'+issue+' : '+decision,content:btoa(String.fromCharCode(...new TextEncoder().encode(body))),sha})});
    if(!r.ok)throw new Error('écriture GitHub '+r.status);
    sgSent[issue]=decision==='accepter'?'acceptée':'rejetée';sgMsg='';adminRender();
  }catch(e){sgMsg='Échec : '+e.message+'. Vérifiez le jeton GitHub.';adminRender()}
}
function sgBind(){
  const val=id=>(($(id)||{}).value||'').trim();
  document.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>{const n=+b.dataset.acc,t=val('sg_t'+n);if(!t)return;sgDecide(n,'accepter',{texte_corrige:t,annuaire:!!($('sg_a'+n)||{}).checked,motif:val('sg_m'+n)})});
  document.querySelectorAll('[data-rej]').forEach(b=>b.onclick=()=>{const n=+b.dataset.rej;if(b.dataset.undo&&!confirm('Annuler la correction du signalement n°'+n+' ? Le texte d\'origine sera republié.'))return;sgDecide(n,'rejeter',{motif:val('sg_m'+n)||(b.dataset.undo?'correction annulée par l\'administrateur':'')})});
}
function tabP(){
  const M=(A.state||{}).media_state||{},V=(A.state||{}).last_video||{};
  const cf=Object.entries(M.consecutive_failures||{}),ls=Object.entries(M.last_sent||{}),su=Object.entries(M.sent_urls||{});
  const bySrc={};A.summaries.forEach(s=>{const o=bySrc[s.source]=bySrc[s.source]||{n:0,last:s.published_at};o.n++});
  const t=(head,rows)=>'<table><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+(rows.join('')||'<tr><td colspan="'+head.length+'" class="mono">Aucune donnée</td></tr>')+'</table>';
  const RP=Object.entries((((A.state||{}).reprise)||{}).items||{});
  const SN={faits:'faits extraits',verification:'faits vérifiés',redaction:'texte rédigé'};
  const rp='<h2>Travaux en attente de reprise ('+RP.length+')</h2><p style="font-size:14px">Contenus commencés mais pas encore publiés (coupure de Gemini, envoi raté, budget de temps). Les étapes déjà faites ne sont pas refaites au passage suivant ; abandon après 48 h.</p>'
    +t(['Contenu','Étapes déjà faites','Passages','Dernière étape'],RP.map(([k,v])=>'<tr><td>'+esc(v.label||'')+'<div class="mono">'+esc(k)+'</div></td><td>'+esc(Object.keys(v.steps||{}).map(s=>SN[s]||s.replace('segment_','partie ')).join(', '))+'</td><td>'+(v.passages||1)+'</td><td>'+dt(v.updated)+'</td></tr>'));
  return tabGem()+rp+'<h2>Échecs consécutifs par source</h2>'+t(['Source','Échecs'],cf.map(([k,n])=>'<tr><td>'+esc(k)+'</td><td><span class="b '+(n>=3?'bad':n?'warn':'ok')+'">'+n+'</span></td></tr>'))
   +'<h2>Dernier épisode envoyé</h2>'+t(['Programme','Épisode'],ls.map(([k,x])=>'<tr><td>'+esc(k)+'</td><td>'+esc(x)+'</td></tr>'))
   +'<h2>Articles déjà envoyés</h2>'+t(['Source','Nombre'],su.map(([k,x])=>'<tr><td>'+esc(k)+'</td><td>'+(x||[]).length+'</td></tr>'))
   +'<h2>Dernière vidéo Équinoxe</h2><div class="mono">'+esc(V.last_video_id||'-')+'</div>'
   +'<h2>Résumés archivés par source</h2>'+t(['Source','Résumés','Dernier'],Object.entries(bySrc).map(([k,o])=>'<tr><td>'+esc(k)+'</td><td>'+o.n+'</td><td>'+dt(o.last)+'</td></tr>'));
}
function tabS(){
  return A.summaries.map(s=>{const k=KIND[s.kind]||KIND.texte;return '<article class="card"><div class="meta"><span class="src">'+esc(s.source)+'</span><span>'+dt(s.published_at)+'</span><span class="tag'+(k[1]?' warn':'')+'">'+k[0]+'</span></div><div class="msg">'+msg(s.message)+'</div><div class="mono" style="margin-top:8px">id '+esc(s.id)+' · rapport '+esc(s.report_id||'-')+'<br>'+link(s.url)+'</div></article>'}).join('')||'<div id="state">Aucun résumé.</div>';
}

adminLink();addEventListener('hashchange',()=>{adminLink();if(location.hash==='#admin')showAdmin(true)});
if(location.hash==='#admin')showAdmin(true);
